name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run unit test suite
        run: |
          pytest tests/ -v --tb=short

      - name: Verify CLI schema inspection & Data Dictionary
        run: |
          python -m oryva_planning.cli inspect-schema --export-markdown docs/data_dictionary.md --export-ddl docs/schema.sql

      - name: Run generation and planning pipeline (starter scale)
        run: |
          python -m oryva_planning.cli generate --config config/starter.yaml

      - name: Run DuckDB SQL validation suite
        run: |
          python -m oryva_planning.cli validate --config config/starter.yaml

      - name: Run anomaly injection and detector precision/recall benchmark
        run: |
          python -m oryva_planning.cli detect-anomalies --config config/starter.yaml

      - name: Run deterministic reproducibility audit
        run: |
          python -m oryva_planning.cli repro --config config/starter.yaml --report-path reproducibility_report.md

      - name: Run multi-format exports (CSV, JSON, SQL seed, SQLite)
        run: |
          python -m oryva_planning.cli export --config config/starter.yaml --export-dir data/exports
