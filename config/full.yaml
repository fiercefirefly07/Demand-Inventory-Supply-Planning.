# Oryva Planning - Full Scale Production Configuration
seed: 20261022
year: 2026
planning_horizon_weeks: 52
description: "Full production scale: 3,000 SKUs, 50 locations, 52 weeks (7.8M demand rows), 500 suppliers, 10,000 inbound orders"

scale:
  name: "full"
  num_skus: 3000
  num_locations: 50
  num_suppliers: 500
  num_inbound_pos: 10000
  avg_substitutes_per_sku: 2
  avg_suppliers_per_sku: 3

anomaly_injection:
  enabled: true
  inbound_double_count_n: 10
  unapproved_substitute_n: 10
  supplier_capacity_exceeded_n: 10
  shortage_without_lead_time_n: 10
  uom_mismatch_n: 10

mitigation:
  weights:
    service_level: 0.50
    cost: 0.30
    lead_time: 0.20

paths:
  input_dir: "data/inputs"
  ground_truth_dir: "data/ground_truth"
  export_dir: "data/exports"
